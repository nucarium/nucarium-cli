[package]
name = "nucleate"
version = "0.0.0-dev"
edition = "2021"
description = "Multi-repo session workspaces for coding agents, built from bare repositories and git worktrees"
authors = ["Mataki Labs LLC"]
repository = "https://github.com/nucarium/nucarium-cli"
homepage = "https://nucarium.dev"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.4"
glob = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", features = ["json", "rustls"], default-features = false }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[profile.release]
strip = true
lto = true

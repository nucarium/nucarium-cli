name: Build

# fmt, clippy and the whole test suite, the privacy gate in tests/privacy.rs
# and the setup gate in tests/setup.rs among them, on Linux and on macOS.
#
# Runs on every pull request. A push to main does not start it here:
# release.yml calls it on that push and creates a release only if it passes,
# so the commit a release tags is the commit these jobs tested.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # A release also ships macOS archives for the Homebrew tap, so prove both
  # of those targets still build and the tests pass on macOS.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add x86_64-apple-darwin
      - run: cargo test
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
